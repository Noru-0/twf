version: '3.8'

services:
  # Frontend development with hot reload
  frontend-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: bus-ticket-frontend-dev
    ports:
      - "8000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:3000
      - WATCHPACK_POLLING=true
      - FAST_REFRESH=true
    networks:
      - frontend-dev-network
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev
    stdin_open: true
    tty: true

  # Storybook for component development (optional)
  storybook-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: bus-ticket-storybook-dev
    ports:
      - "6006:6006"
    environment:
      - NODE_ENV=development
    networks:
      - frontend-dev-network
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run storybook
    profiles:
      - storybook

networks:
  frontend-dev-network:
    driver: bridge